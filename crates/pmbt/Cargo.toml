[package]
name    = "pmbt"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Event-driven prediction-market backtesting engine"
repository = "https://github.com/EndEvao/pmbt"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "assets/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
# default-features off, opting into just what the readers and the converter
# need: arrow = RecordBatch API, snap/zstd = the codecs Telonex files use
# (SNAPPY is also what the converter writes, for parity).
parquet = { version = "59.1.0", default-features = false, features = ["arrow", "snap", "zstd"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2"
toml = "1.1.3"

[dev-dependencies]
arrow-buffer = "59.1.0"
bytes = "1.12.1"
