[package]
name = "pmbt-live"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Live paper market-data adapter for pmbt"

[dependencies]
pmbt = { path = "../pmbt", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# The WebSocket crate disables Rustls defaults; select its crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", features = ["sink"] }
